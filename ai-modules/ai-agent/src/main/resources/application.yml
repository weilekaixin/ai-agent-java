server:
  port: 8081

spring:
  application:
    name: ai-agent
  profiles:
    active: ${profiles.active:dev}

agent:
  chat:
    timeout: 300_000

forest:
  connect-timeout: 5000      # 5 s to establish TCP connection
  read-timeout: 300000       # 5 min read timeout (matches SSE stream duration)
  max-retry-count: 1         # retry once on transient network errors
  variables:
    # AGENT_BASE_URL 环境变量可覆盖，实现 dev/prod 切换
    agent_base_url: ${AGENT_BASE_URL:http://localhost:8000}
    agent_api_key: ${AGENT_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: ai-agent
    description: AI Agent 消息网关服务

--- # nacos 配置
spring:
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: ${nacos.discovery.group:DEFAULT_GROUP}
        namespace: ${spring.profiles.active}
      config:
        group: ${nacos.config.group:DEFAULT_GROUP}
        namespace: ${spring.profiles.active}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.yml
