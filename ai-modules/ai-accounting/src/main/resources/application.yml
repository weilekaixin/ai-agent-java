server:
  port: ${ACCOUNTING_PORT:8091}

mybatis-plus:
  mapperPackage: com.ai.modules.accounting.mapper

sa-token:
  token-name: ${AUTH_TOKEN_NAME:satoken}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
  application:
    name: ai-accounting
  profiles:
    active: ${profiles.active:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: ${nacos.discovery.group:DEFAULT_GROUP}
        namespace: ${spring.profiles.active}
      config:
        group: ${nacos.config.group:DEFAULT_GROUP}
        namespace: ${spring.profiles.active}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.yml
