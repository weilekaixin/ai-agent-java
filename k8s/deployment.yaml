apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-java
  namespace: ai-agent
  labels:
    app: ai-agent-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-java
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-agent-java
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-agent-java
          image: ai-agent-java:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-agent-java-config
            - secretRef:
                name: ai-agent-java-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
